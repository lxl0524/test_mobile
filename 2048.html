<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #faf8ef;
    font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 16px;
    color: #776e65;
    overflow-x: hidden;
  }
  .header {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 48px;
    font-weight: 700;
    color: #776e65;
  }
  .scores {
    display: flex;
    gap: 8px;
  }
  .score-box {
    background: #bbada0;
    border-radius: 6px;
    padding: 8px 14px;
    text-align: center;
    min-width: 70px;
  }
  .score-box span {
    display: block;
    font-size: 11px;
    color: #eee4da;
    text-transform: uppercase;
  }
  .score-box b {
    display: block;
    font-size: 22px;
    color: #fff;
    margin-top: 2px;
  }
  .sub {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .sub p { font-size: 14px; line-height: 1.4; }
  .btn {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 4px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:active { background: #7f6a56; }
  .game-container {
    position: relative;
    background: #bbada0;
    border-radius: 8px;
    padding: 8px;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
    touch-action: none;
  }
  .grid-container, .tile-container {
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
  }
  .grid-cell {
    position: absolute;
    background: rgba(238, 228, 218, 0.35);
    border-radius: 6px;
  }
  .tile {
    position: absolute;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    transition: transform 0.12s ease, opacity 0.12s ease;
    z-index: 2;
  }
  .tile.new { animation: pop 0.18s ease; }
  .tile.merged { animation: merge 0.18s ease; }
  @keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @keyframes merge {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .tile-2    { background: #eee4da; color: #776e65; }
  .tile-4    { background: #ede0c8; color: #776e65; }
  .tile-8    { background: #f2b179; color: #f9f6f2; }
  .tile-16   { background: #f59563; color: #f9f6f2; }
  .tile-32   { background: #f67c5f; color: #f9f6f2; }
  .tile-64   { background: #f65e3b; color: #f9f6f2; }
  .tile-128  { background: #edcf72; color: #f9f6f2; }
  .tile-256  { background: #edcc61; color: #f9f6f2; }
  .tile-512  { background: #edc850; color: #f9f6f2; }
  .tile-1024 { background: #edc53f; color: #f9f6f2; }
  .tile-2048 { background: #edc22e; color: #f9f6f2; }
  .tile-super { background: #3c3a32; color: #f9f6f2; }
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(238, 228, 218, 0.73);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: 42px; margin-bottom: 16px; }
  .overlay p { font-size: 18px; margin-bottom: 16px; color: #8f7a66; }
  .hint {
    margin-top: 18px;
    font-size: 13px;
    color: #776e65;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <h1>2048</h1>
  <div class="scores">
    <div class="score-box"><span>得分</span><b id="score">0</b></div>
    <div class="score-box"><span>最佳</span><b id="best">0</b></div>
  </div>
</div>

<div class="sub">
  <p>滑动屏幕或按方向键<br>合并相同数字，得到 2048！</p>
  <button class="btn" id="newGame">新游戏</button>
</div>

<div class="game-container" id="game">
  <div class="grid-container" id="grid"></div>
  <div class="tile-container" id="tiles"></div>
  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">游戏结束</h2>
    <button class="btn" id="tryAgain">再试一次</button>
  </div>
</div>

<p class="hint">支持手势滑动、键盘方向键、WASD</p>

<script>
const SIZE = 4;
let board, score, best, hasMoved, won;

const gridEl = document.getElementById('grid');
const tilesEl = document.getElementById('tiles');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const gameEl = document.getElementById('game');

function init() {
  board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  score = 0;
  hasMoved = false;
  won = false;
  best = Number(localStorage.getItem('best2048')) || 0;
  updateScore();
  hideOverlay();
  addRandomTile();
  addRandomTile();
  render();
}

function updateScore() {
  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    localStorage.setItem('best2048', best);
  }
  bestEl.textContent = best;
}

function addRandomTile() {
  const empty = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) empty.push({r, c});
    }
  }
  if (empty.length === 0) return;
  const {r, c} = empty[Math.floor(Math.random() * empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  drawGrid();
  drawTiles();
}

function drawGrid() {
  if (gridEl.children.length === 0) {
    const gap = 8;
    const cell = (100 - gap * (SIZE + 1)) / SIZE;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const div = document.createElement('div');
        div.className = 'grid-cell';
        div.style.width = cell + '%';
        div.style.height = cell + '%';
        div.style.top = (gap + r * (cell + gap)) + '%';
        div.style.left = (gap + c * (cell + gap)) + '%';
        gridEl.appendChild(div);
      }
    }
  }
}

function drawTiles() {
  tilesEl.innerHTML = '';
  const gap = 8;
  const cell = (100 - gap * (SIZE + 1)) / SIZE;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const val = board[r][c];
      if (val === 0) continue;
      const tile = document.createElement('div');
      tile.className = `tile tile-${val > 2048 ? 'super' : val}`;
      tile.textContent = val;
      tile.style.width = cell + '%';
      tile.style.height = cell + '%';
      tile.style.top = (gap + r * (cell + gap)) + '%';
      tile.style.left = (gap + c * (cell + gap)) + '%';
      tile.style.fontSize = fontSize(val);
      tilesEl.appendChild(tile);
    }
  }
}

function fontSize(val) {
  if (val < 100) return 'clamp(24px, 8vw, 42px)';
  if (val < 1000) return 'clamp(20px, 7vw, 36px)';
  if (val < 10000) return 'clamp(16px, 5.5vw, 30px)';
  return 'clamp(14px, 5vw, 24px)';
}

function slideRow(row) {
  let arr = row.filter(v => v !== 0);
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i + 1]) {
      arr[i] *= 2;
      score += arr[i];
      if (arr[i] === 2048 && !won) {
        won = true;
        showOverlay('你赢了！', true);
      }
      arr[i + 1] = 0;
    }
  }
  arr = arr.filter(v => v !== 0);
  while (arr.length < SIZE) arr.push(0);
  return arr;
}

function moveLeft() {
  for (let r = 0; r < SIZE; r++) {
    const old = [...board[r]];
    board[r] = slideRow(board[r]);
    if (!hasMoved && old.some((v, i) => v !== board[r][i])) hasMoved = true;
  }
}

function moveRight() {
  for (let r = 0; r < SIZE; r++) {
    const old = [...board[r]];
    board[r] = slideRow(board[r].reverse()).reverse();
    if (!hasMoved && old.some((v, i) => v !== board[r][i])) hasMoved = true;
  }
}

function moveUp() {
  for (let c = 0; c < SIZE; c++) {
    const col = [board[0][c], board[1][c], board[2][c], board[3][c]];
    const old = [...col];
    const newCol = slideRow(col);
    for (let r = 0; r < SIZE; r++) board[r][c] = newCol[r];
    if (!hasMoved && old.some((v, i) => v !== newCol[i])) hasMoved = true;
  }
}

function moveDown() {
  for (let c = 0; c < SIZE; c++) {
    const col = [board[0][c], board[1][c], board[2][c], board[3][c]];
    const old = [...col];
    const newCol = slideRow(col.reverse()).reverse();
    for (let r = 0; r < SIZE; r++) board[r][c] = newCol[r];
    if (!hasMoved && old.some((v, i) => v !== newCol[i])) hasMoved = true;
  }
}

function makeMove(direction) {
  if (overlay.classList.contains('show') && !won) return;
  if (overlay.classList.contains('show') && won) hideOverlay();

  hasMoved = false;
  if (direction === 'left') moveLeft();
  else if (direction === 'right') moveRight();
  else if (direction === 'up') moveUp();
  else if (direction === 'down') moveDown();

  if (hasMoved) {
    addRandomTile();
    updateScore();
    render();
    if (!canMove()) showOverlay('游戏结束');
  }
}

function canMove() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) return true;
      if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return true;
      if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return true;
    }
  }
  return false;
}

function showOverlay(title, keepPlaying = false) {
  overlayTitle.textContent = title;
  overlay.classList.add('show');
  if (keepPlaying) {
    overlayTitle.insertAdjacentHTML('afterend', '<p id="keepPlayingHint">继续游戏，挑战更高分！</p>');
  }
}

function hideOverlay() {
  overlay.classList.remove('show');
  const hint = document.getElementById('keepPlayingHint');
  if (hint) hint.remove();
}

// Input handling
const keyMap = {
  'ArrowLeft': 'left', 'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down',
  'a': 'left', 'd': 'right', 'w': 'up', 's': 'down',
  'A': 'left', 'D': 'right', 'W': 'up', 'S': 'down'
};

document.addEventListener('keydown', e => {
  if (keyMap[e.key]) {
    e.preventDefault();
    makeMove(keyMap[e.key]);
  }
});

let startX, startY;
gameEl.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
}, { passive: true });

gameEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;
  const minSwipe = 30;
  if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    makeMove(dx > 0 ? 'right' : 'left');
  } else {
    makeMove(dy > 0 ? 'down' : 'up');
  }
}, { passive: true });

// Mouse drag support for desktop
gameEl.addEventListener('mousedown', e => {
  startX = e.clientX;
  startY = e.clientY;
});
gameEl.addEventListener('mouseup', e => {
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  const minSwipe = 30;
  if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    makeMove(dx > 0 ? 'right' : 'left');
  } else {
    makeMove(dy > 0 ? 'down' : 'up');
  }
});

document.getElementById('newGame').addEventListener('click', init);
document.getElementById('tryAgain').addEventListener('click', init);

init();
</script>

</body>
</html>
