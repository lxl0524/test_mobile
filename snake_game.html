<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #eee;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
    letter-spacing: 2px;
    color: #0f0;
    text-shadow: 0 0 10px rgba(0,255,0,.4);
  }
  #info {
    display: flex;
    gap: 32px;
    margin-bottom: 10px;
    font-size: 1rem;
  }
  #info span { color: #aaa; }
  #info b { color: #0f0; }
  canvas {
    border: 2px solid #0f0;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0,255,0,.15);
    background: #16213e;
  }
  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #overlay.active { pointer-events: auto; }
  #overlay .msg {
    font-size: 1.8rem;
    font-weight: bold;
    color: #0f0;
    text-shadow: 0 0 12px rgba(0,255,0,.6);
    margin-bottom: 12px;
  }
  #overlay .sub {
    font-size: 1rem;
    color: #aaa;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  #controls {
    display: none;
    margin-top: 14px;
    gap: 4px;
  }
  #controls button {
    width: 56px; height: 56px;
    font-size: 1.4rem;
    border: 1px solid #0f0;
    border-radius: 8px;
    background: rgba(0,255,0,.08);
    color: #0f0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #controls button:active { background: rgba(0,255,0,.25); }
  @media (pointer: coarse) {
    #controls { display: grid; grid-template-columns: repeat(3,56px); grid-template-rows: repeat(2,56px); justify-items: center; }
  }
</style>
</head>
<body>
<h1>贪吃蛇</h1>
<div id="info">
  <div>得分: <b id="score">0</b></div>
  <div>最高: <b id="best">0</b></div>
</div>
<div style="position:relative;display:inline-block">
  <canvas id="game"></canvas>
  <div id="overlay" class="active">
    <div class="msg" id="overlayMsg">贪吃蛇</div>
    <div class="sub" id="overlaySub">按任意键 / 点击屏幕开始</div>
  </div>
</div>
<div id="controls">
  <div></div>
  <button id="btnUp">▲</button>
  <div></div>
  <button id="btnLeft">◀</button>
  <button id="btnDown">▼</button>
  <button id="btnRight">▶</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayMsg = document.getElementById('overlayMsg');
const overlaySub = document.getElementById('overlaySub');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

const CELL = 20;
const COLS = 20, ROWS = 20;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

// size overlay to canvas
overlay.style.width = canvas.width + 'px';
overlay.style.height = canvas.height + 'px';

let snake, dir, nextDir, food, score, best = 0, speed, timer, state;

function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  speed = 130;
  scoreEl.textContent = 0;
  placeFood();
}

function placeFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x===pos.x && s.y===pos.y));
  food = pos;
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // grid
  ctx.strokeStyle = 'rgba(255,255,255,.03)';
  for (let x=0;x<COLS;x++) for (let y=0;y<ROWS;y++) ctx.strokeRect(x*CELL,y*CELL,CELL,CELL);

  // food
  ctx.fillStyle = '#ff2e63';
  ctx.shadowColor = '#ff2e63';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-2, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // snake
  snake.forEach((s,i) => {
    const t = 1 - i/snake.length;
    ctx.fillStyle = `rgba(0,${Math.floor(180+75*t)},0,${0.6+0.4*t})`;
    ctx.shadowColor = i===0 ? '#0f0' : 'transparent';
    ctx.shadowBlur = i===0 ? 8 : 0;
    const pad = i===0 ? 1 : 2;
    ctx.fillRect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2);
  });
  ctx.shadowBlur = 0;
}

function update() {
  dir = nextDir;
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};

  // wall collision
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) return gameOver();
  // self collision
  if (snake.some(s=>s.x===head.x&&s.y===head.y)) return gameOver();

  snake.unshift(head);

  if (head.x===food.x && head.y===food.y) {
    score++;
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; }
    if (speed > 60) speed -= 2;
    placeFood();
  } else {
    snake.pop();
  }
}

function loop() {
  update();
  draw();
  if (state === 'playing') timer = setTimeout(loop, speed);
}

function gameOver() {
  state = 'over';
  overlayMsg.textContent = `得分: ${score}`;
  overlaySub.textContent = '按任意键 / 点击屏幕重新开始';
  overlay.classList.add('active');
}

function start() {
  overlay.classList.remove('active');
  init();
  state = 'playing';
  draw();
  loop();
}

// keyboard
document.addEventListener('keydown', e => {
  if (state !== 'playing') { start(); return; }
  const map = {ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
               w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  const nd = map[e.key];
  if (nd && (nd.x+dir.x!==0 || nd.y+dir.y!==0)) nextDir = nd;
});

// touch / click
canvas.parentElement.addEventListener('click', () => { if (state!=='playing') start(); });

// swipe
let tx, ty;
canvas.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; });
canvas.addEventListener('touchend', e => {
  if (state !== 'playing') { start(); return; }
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx)+Math.abs(dy) < 20) return;
  let nd;
  if (Math.abs(dx) > Math.abs(dy)) nd = dx>0?{x:1,y:0}:{x:-1,y:0};
  else nd = dy>0?{x:0,y:1}:{x:0,y:-1};
  if (nd.x+dir.x!==0||nd.y+dir.y!==0) nextDir = nd;
});

// on-screen buttons
document.getElementById('btnUp').addEventListener('click', ()=>setDir(0,-1));
document.getElementById('btnDown').addEventListener('click', ()=>setDir(0,1));
document.getElementById('btnLeft').addEventListener('click', ()=>setDir(-1,0));
document.getElementById('btnRight').addEventListener('click', ()=>setDir(1,0));
function setDir(x,y) {
  if (state!=='playing') { start(); return; }
  if (x+dir.x!==0||y+dir.y!==0) nextDir={x,y};
}

// initial draw
state = 'idle';
init();
draw();
</script>
</body>
</html>
