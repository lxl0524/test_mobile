<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #eee;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
    letter-spacing: 2px;
    color: #0f0;
    text-shadow: 0 0 10px rgba(0,255,0,.4);
  }
  #info {
    display: flex;
    gap: 32px;
    margin-bottom: 10px;
    font-size: 1rem;
  }
  #info span { color: #aaa; }
  #info b { color: #0f0; }
  canvas {
    border: 2px solid #0f0;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0,255,0,.15);
    background: #16213e;
  }
  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(22,33,62,.72);
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s;
    border-radius: 4px;
  }
  #overlay.active { pointer-events: auto; opacity: 1; }
  #overlay .msg {
    font-size: 1.8rem;
    font-weight: bold;
    color: #0f0;
    text-shadow: 0 0 12px rgba(0,255,0,.6);
    margin-bottom: 12px;
  }
  #overlay .sub {
    font-size: 1rem;
    color: #aaa;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  #hint {
    margin-top: 8px;
    font-size: .8rem;
    color: #556;
  }
  #controls {
    display: none;
    margin-top: 14px;
    gap: 4px;
  }
  #controls button {
    width: 56px; height: 56px;
    font-size: 1.4rem;
    border: 1px solid #0f0;
    border-radius: 8px;
    background: rgba(0,255,0,.08);
    color: #0f0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #controls button:active { background: rgba(0,255,0,.25); }
  @media (pointer: coarse) {
    #controls { display: grid; grid-template-columns: repeat(3,56px); grid-template-rows: repeat(2,56px); justify-items: center; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<h1>贪吃蛇</h1>
<div id="info">
  <div>得分: <b id="score">0</b></div>
  <div>最高: <b id="best">0</b></div>
  <div>长度: <b id="len">3</b></div>
</div>
<div style="position:relative;display:inline-block">
  <canvas id="game"></canvas>
  <div id="overlay" class="active">
    <div class="msg" id="overlayMsg">贪吃蛇</div>
    <div class="sub" id="overlaySub">按任意键 / 点击屏幕开始</div>
  </div>
</div>
<div id="hint">方向键 / WASD 移动 · 空格暂停</div>
<div id="controls">
  <div></div>
  <button id="btnUp">▲</button>
  <div></div>
  <button id="btnLeft">◀</button>
  <button id="btnDown">▼</button>
  <button id="btnRight">▶</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayMsg = document.getElementById('overlayMsg');
const overlaySub = document.getElementById('overlaySub');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const lenEl = document.getElementById('len');

const CELL = 20;
const COLS = 20, ROWS = 20;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

// size overlay to canvas
overlay.style.width = canvas.width + 'px';
overlay.style.height = canvas.height + 'px';

// 棋盘内可用格数
const TOTAL_CELLS = COLS * ROWS;

let snake, dir, dirQueue, food, score, speed, timer, state;
let best = +(localStorage.getItem('snake_best') || 0);
bestEl.textContent = best;
let eatAnim = 0; // 吃到食物的闪烁帧计数

function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  dirQueue = [];
  score = 0;
  speed = 130;
  scoreEl.textContent = 0;
  lenEl.textContent = snake.length;
  placeFood();
}

function placeFood() {
  // 蛇占满棋盘则胜利
  if (snake.length >= TOTAL_CELLS) return win();
  const free = [];
  for (let x=0;x<COLS;x++) for (let y=0;y<ROWS;y++) {
    if (!snake.some(s => s.x===x && s.y===y)) free.push({x,y});
  }
  food = free[Math.floor(Math.random()*free.length)];
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // grid
  ctx.strokeStyle = 'rgba(255,255,255,.03)';
  for (let x=0;x<COLS;x++) for (let y=0;y<ROWS;y++) ctx.strokeRect(x*CELL,y*CELL,CELL,CELL);

  // food (呼吸脉动效果)
  if (food) {
    const pulse = 1 + 0.12*Math.sin(Date.now()/180);
    const r = (CELL/2-2) * pulse;
    ctx.fillStyle = '#ff2e63';
    ctx.shadowColor = '#ff2e63';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // snake：圆角矩形 + 头尾渐变
  ctx.lineJoin = 'round';
  snake.forEach((s,i) => {
    const t = 1 - i/snake.length;
    const g = Math.floor(180+75*t);
    const flash = eatAnim > 0 && i < 3 ? 60 : 0; // 刚吃到食物时头部闪白
    ctx.fillStyle = `rgba(${flash},${g+flash},${flash},${0.6+0.4*t})`;
    ctx.shadowColor = i===0 ? '#0f0' : 'transparent';
    ctx.shadowBlur = i===0 ? 8 : 0;
    const pad = i===0 ? 1 : 2;
    const x = s.x*CELL+pad, y = s.y*CELL+pad, w = CELL-pad*2;
    const rad = i===0 ? 6 : 5;
    ctx.beginPath();
    ctx.roundRect(x, y, w, w, rad);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
}

function update() {
  // 从队列取出下一个方向（跳过无效的）
  while (dirQueue.length) {
    const nd = dirQueue.shift();
    if (nd.x+dir.x!==0 || nd.y+dir.y!==0) { dir = nd; break; }
  }
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};

  // wall collision
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) return gameOver();
  // self collision（尾巴即将移走的格子不算碰撞）
  const willEat = head.x===food.x && head.y===food.y;
  const body = willEat ? snake : snake.slice(0, -1);
  if (body.some(s=>s.x===head.x&&s.y===head.y)) return gameOver();

  snake.unshift(head);

  if (willEat) {
    score++;
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('snake_best', best); }
    if (speed > 60) speed -= 2;
    eatAnim = 3;
    placeFood();
  } else {
    snake.pop();
  }
  lenEl.textContent = snake.length;
  if (eatAnim > 0) eatAnim--;
}

function loop() {
  update();
  if (state !== 'playing') { draw(); return; }
  draw();
  timer = setTimeout(loop, speed);
}

function gameOver() {
  state = 'over';
  const isNewBest = score === best && score > 0;
  overlayMsg.textContent = isNewBest ? `新纪录! ${score}` : `得分: ${score}`;
  overlaySub.textContent = '按任意键 / 点击屏幕重新开始';
  overlay.classList.add('active');
}

function win() {
  state = 'over';
  food = null;
  overlayMsg.textContent = '你赢了！';
  overlaySub.textContent = '按任意键 / 点击屏幕重新开始';
  overlay.classList.add('active');
  draw();
}

function pause() {
  state = 'paused';
  overlayMsg.textContent = '暂停';
  overlaySub.textContent = '按空格 / 点击屏幕继续';
  overlay.classList.add('active');
  draw();
}

function resume() {
  state = 'playing';
  overlay.classList.remove('active');
  loop();
}

function start() {
  clearTimeout(timer);
  overlay.classList.remove('active');
  init();
  state = 'playing';
  draw();
  loop();
}

// 统一的方向处理：支持输入队列，快速连按不丢方向
function queueDir(nd) {
  if (state !== 'playing') return;
  const last = dirQueue.length ? dirQueue[dirQueue.length-1] : dir;
  if (nd.x+last.x!==0 || nd.y+last.y!==0) {
    if (nd.x!==last.x || nd.y!==last.y) dirQueue.push(nd);
    if (dirQueue.length > 3) dirQueue.shift();
  }
}

// keyboard
document.addEventListener('keydown', e => {
  const map = {ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
               w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},
               W:{x:0,y:-1},S:{x:0,y:1},A:{x:-1,y:0},D:{x:1,y:0}};
  // 防止方向键/空格滚动页面
  if (map[e.key] || e.key === ' ') e.preventDefault();

  if (e.key === ' ') {
    if (state === 'playing') pause();
    else if (state === 'paused') resume();
    else if (state !== 'undefined' && state !== 'playing') start();
    return;
  }
  if (state === 'paused') { resume(); }
  if (state !== 'playing') { start(); return; }
  const nd = map[e.key];
  if (nd) queueDir(nd);
});

// touch / click
canvas.parentElement.addEventListener('click', () => {
  if (state === 'paused') resume();
  else if (state !== 'playing') start();
});

// swipe
let tx, ty;
canvas.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  if (state === 'paused') { resume(); return; }
  if (state !== 'playing') { start(); return; }
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx)+Math.abs(dy) < 20) return;
  let nd;
  if (Math.abs(dx) > Math.abs(dy)) nd = dx>0?{x:1,y:0}:{x:-1,y:0};
  else nd = dy>0?{x:0,y:1}:{x:0,y:-1};
  queueDir(nd);
});

// on-screen buttons
document.getElementById('btnUp').addEventListener('click', ()=>setDir(0,-1));
document.getElementById('btnDown').addEventListener('click', ()=>setDir(0,1));
document.getElementById('btnLeft').addEventListener('click', ()=>setDir(-1,0));
document.getElementById('btnRight').addEventListener('click', ()=>setDir(1,0));
function setDir(x,y) {
  if (state === 'paused') { resume(); return; }
  if (state !== 'playing') { start(); return; }
  queueDir({x,y});
}

// initial draw
state = 'idle';
init();
draw();
</script>
</body>
</html>
